<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Угадай мелодию</title>
<style>
:root{--bg:#090a0e;--card:#12141b;--line:#30343f;--text:#f7f7f8;--muted:#a6a8b1;--red:#e21b2d;--green:#27c46a;--gold:#ffc928}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1b1d27,#090a0e 58%);color:var(--text);font:16px Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.logo{font-size:30px;font-weight:900}.muted{color:var(--muted)}.card{background:#12141aee;border:1px solid var(--line);border-radius:18px;padding:18px}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:18px 0}.note{min-height:78px;border:1px solid #3a3d48;background:#1b1e27;color:#fff;border-radius:14px;font-size:26px;font-weight:900;cursor:pointer}.note.used{opacity:.18;cursor:default}.cat{font-size:14px;color:#c8cad1;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}.scores{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.team{background:#171920;border:1px solid var(--line);border-radius:14px;padding:14px}.team b{display:block;margin-bottom:7px}.pts{font-size:28px;font-weight:900}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}button,input,select{font:inherit}button{min-height:44px;border-radius:11px;border:1px solid var(--line);background:#20232b;color:#fff;padding:10px 15px;font-weight:800;cursor:pointer}button.primary{background:#fff;color:#111}button.good{background:#153d28;border-color:#267a4b}button.bad{background:#45171d;border-color:#8d2834}button:disabled{opacity:.45;cursor:not-allowed}.big{font-size:34px;padding:28px 42px;border-radius:20px;background:var(--red);color:#fff;border:2px solid #ff5a67;font-weight:900;box-shadow:0 8px 35px #e21b2d44}.center{text-align:center}.hidden{display:none}.status{font-size:20px;font-weight:800;margin:9px 0}.answer{font-size:25px;font-weight:900;margin:15px 0;min-height:30px}.join{max-width:560px;margin:50px auto}.join input,.join select{width:100%;padding:14px;border-radius:10px;border:1px solid var(--line);background:#0e1015;color:#fff;margin:7px 0}.code{font-size:40px;font-weight:900;letter-spacing:6px}.winner{font-size:30px;font-weight:900;margin:15px 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.qr{background:#fff;padding:10px;border-radius:12px;width:190px;height:190px}.upload-list{display:grid;gap:8px;margin-top:14px}.upload-item{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);padding:9px;border-radius:10px}.small{font-size:13px}.host-grid{display:grid;grid-template-columns:1fr 300px;gap:14px;margin-top:18px}.panel h3{margin-top:0}.linkbox{word-break:break-all;background:#0d0f14;padding:10px;border-radius:10px;font-size:13px}.flash{font-size:28px;font-weight:900;padding:12px;border-radius:12px;margin-top:12px;background:#2b2024}.setup-team{display:flex;gap:8px;margin:7px 0}.setup-team input{margin:0!important}.team-num{width:55px;text-align:center}@media(max-width:800px){.host-grid{grid-template-columns:1fr}.board{grid-template-columns:repeat(3,1fr)}.scores{grid-template-columns:repeat(2,1fr)}.logo{font-size:24px}.upload-item{grid-template-columns:55px 1fr}.upload-item button{grid-column:2}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body><div id="app" class="wrap"></div>
<script>
const CONFIG={url:"https://rplawiqtrscavsvehtua.supabase.co",key:"sb_publishable__D2sRKa4baHynamcd-MQoQ_Tb-pRiEx"};
const configured=!CONFIG.url.startsWith("PASTE_")&&!CONFIG.key.startsWith("PASTE_");
const sb=configured?supabase.createClient(CONFIG.url,CONFIG.key,{auth:{persistSession:false}}):null;
const app=document.querySelector("#app");const params=new URLSearchParams(location.search);
let state={game:null,team:null,sub:null,audio:null,answerVisible:false,teamBlocked:false};
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function shell(html){app.innerHTML=html}
function needConfig(){shell(`<div class="card join center"><h1>Угадай мелодию</h1><p class="muted">Не настроено подключение к Supabase.</p></div>`)}
function hostSetup(){shell(`<div class="card join"><h1>🎙 Создать игру</h1><p class="muted">Ты — ведущий. Настрой команды и получишь код комнаты.</p><input id="title" placeholder="Название игры" value="Угадай мелодию"><label>Количество команд</label><input id="teams" type="number" min="2" max="8" value="4"><div id="teamNames"></div><button class="primary" id="create">Создать игру</button><p id="err" class="muted"></p></div>`);document.querySelector("#teams").oninput=renderTeamInputs;renderTeamInputs();document.querySelector("#create").onclick=createGame}
function renderTeamInputs(){const n=Math.max(2,Math.min(8,+document.querySelector("#teams").value||4));const box=document.querySelector("#teamNames");box.innerHTML=Array.from({length:n},(_,i)=>`<div class="setup-team"><span class="team-num">${i+1}</span><input id="tn${i}" placeholder="Команда ${i+1}" value="Команда ${i+1}"></div>`).join("")}
async function createGame(){const title=document.querySelector("#title").value.trim()||"Угадай мелодию";const n=Math.max(2,Math.min(8,+document.querySelector("#teams").value||4));const code=Math.random().toString(36).slice(2,6).toUpperCase();const teams=Array.from({length:n},(_,i)=>({id:i+1,name:document.querySelector(`#tn${i}`).value.trim()||`Команда ${i+1}`,score:0}));const cats=["Хиты 90-х","Русский рок","Поп-хиты","Дискотека","Финал"];const answers=["Руки Вверх! — Крошка моя","Иванушки International — Тополиный пух","Звери — Районы-кварталы","Кино — Группа крови","МакSим — Знаешь ли ты"];const questions=Array.from({length:25},(_,i)=>({id:i+1,value:((i%5)+1)*100,category:cats[i%5],title:`Мелодия №${i+1}`,answer:answers[i%5],audio_url:null,used:false}));const {data,error}=await sb.from("games").insert({code,title,teams,questions,status:"lobby",blocked_team_ids:[]}).select().single();if(error){document.querySelector("#err").textContent=error.message;return}location.search="?host="+data.code}
async function loadGame(code){const {data,error}=await sb.from("games").select("*").eq("code",code).single();if(error)throw error;data.blocked_team_ids=data.blocked_team_ids||[];data.undo_state=data.undo_state||null;state.game=data;return data}
function playerUrl(code){return location.origin+location.pathname+"?player="+encodeURIComponent(code)}
function hostView(g){const q=g.questions.find(x=>x.id===g.current_question_id);const locked=g.locked_team_id;const lockedName=locked?g.teams.find(t=>t.id===locked)?.name:"";const blocked=(g.blocked_team_ids||[]).map(id=>g.teams.find(t=>t.id===id)?.name).filter(Boolean);shell(`<div class="top"><div><div class="logo">🎵 ${esc(g.title)}</div><div class="muted">Код комнаты: <b class="code" style="font-size:20px">${g.code}</b></div></div><div class="row"><button id="undo" ${g.undo_state?"":"disabled"}>↶ Отменить</button><button id="prep">⚙ Подготовка</button><button id="reset">Сброс</button></div></div><div class="host-grid"><div><div class="card center"><div class="muted">ТЕКУЩАЯ МЕЛОДИЯ</div><h1>${q?esc(q.title):"Выберите ноту"}</h1>${q?`<div class="muted">${esc(q.category)} · ${q.value} очков</div>`:""}<div id="status" class="status">${locked?`🥇 ${esc(lockedName)} отвечает`:(q?"🎵 Мелодия играет — ждём ЖМАК!":"Готовы к игре")}</div><div class="actions" style="justify-content:center"><button class="primary" id="play" ${q?"":"disabled"}>▶ Играть</button><button id="stop" ${q?"":"disabled"}>⏹ Стоп</button><button class="good" id="correct" ${locked?"":"disabled"}>✅ Правильно +${q?.value||0}</button><button class="bad" id="wrong" ${locked?"":"disabled"}>❌ Неправильно −${q?Math.floor(q.value/2):0}</button><button id="answerBtn" ${q?"":"disabled"}>👀 Показать ответ</button><button id="clear" ${locked?"":"disabled"}>↩ Открыть другим</button></div><div id="answer" class="answer"></div><div class="small muted">За ошибку: −50% стоимости вопроса</div><div id="flash" class="flash ${locked?"":"hidden"}">${locked?`Право ответа: ${esc(lockedName)}`:""}</div></div><div class="board">${g.questions.map(q=>`<button class="note ${q.used?'used':''}" data-id="${q.id}" ${q.used?'disabled':''}><div class="cat">${esc(q.category)}</div>${q.value}</button>`).join("")}</div><div class="scores">${g.teams.map(t=>`<div class="team"><b>${esc(t.name)}</b><div class="pts">${t.score}</div></div>`).join("")}</div></div><div class="card panel center"><h3>📱 Подключение команд</h3><div id="qrcode" class="qr" style="margin:0 auto"></div><p class="small muted">Наведите камеру телефона на QR-код</p><div class="linkbox">${esc(playerUrl(g.code))}</div><p class="small">Код: <b>${g.code}</b></p><button id="copy">Скопировать ссылку</button><hr style="border-color:#30343f"><h3>🎵 Музыка</h3><p class="small muted">Выберите MP3 для текущей мелодии.</p><input id="mp3" type="file" accept="audio/mpeg,audio/mp3,.mp3"><button id="upload" class="primary" ${q?"":"disabled"}>Загрузить MP3</button><p id="uploadStatus" class="small muted"></p>${q?`<p class="small">${q.audio_url?"✅ MP3 загружен":"⚠ MP3 ещё не загружен"}</p>`:""}</div></div>`);
new QRCode(document.getElementById("qrcode"),{text:playerUrl(g.code),width:170,height:170});
document.querySelectorAll(".note").forEach(b=>b.onclick=()=>selectQuestion(+b.dataset.id));document.querySelector("#play").onclick=play;document.querySelector("#stop").onclick=stop;document.querySelector("#correct").onclick=correctAnswer;document.querySelector("#wrong").onclick=wrongAnswer;document.querySelector("#answerBtn").onclick=showAnswer;document.querySelector("#clear").onclick=clearLock;document.querySelector("#undo").onclick=undoLast;document.querySelector("#prep").onclick=()=>preparationView(state.game);document.querySelector("#reset").onclick=resetGame;document.querySelector("#copy").onclick=async()=>{await navigator.clipboard.writeText(playerUrl(g.code));document.querySelector("#copy").textContent="Скопировано ✓"};document.querySelector("#upload").onclick=uploadMp3}
function preparationView(g){
 const cats=["Русский рок","Поп-хиты","Хиты 90-х","Дискотека","Кино и ТВ"];
 shell(`<div class="top"><div><div class="logo">🎙 Подготовка игры</div><div class="muted">Код комнаты: <b class="code" style="font-size:20px">${g.code}</b></div></div><button id="back">← К игре</button></div><div class="card"><h2>Подготовка «${esc(g.title)}»</h2><p class="muted">Здесь ведущий заранее заполняет 25 мелодий. Для каждой клетки можно указать категорию, стоимость, ответ и загрузить MP3.</p><div class="row"><button class="primary" id="start">▶ Начать игру</button><button id="back2">← Вернуться к игре</button></div></div><div class="prep-list">${g.questions.map(q=>`<div class="prep-row" data-id="${q.id}"><div class="prep-num">${q.id}</div><select class="pcat">${cats.map(c=>`<option ${q.category===c?'selected':''}>${c}</option>`).join("")}</select><select class="pval">${[100,200,300,400,500].map(v=>`<option value="${v}" ${q.value===v?'selected':''}>${v}</option>`).join("")}</select><input class="pans" placeholder="Исполнитель — Песня" value="${esc(q.answer||"")}"><input class="pfile" type="file" accept="audio/mpeg,audio/mp3,.mp3" style="display:none"><button class="psave">${q.audio_url?'💾 Заменить MP3':'⬆ Загрузить MP3'}</button><span class="pstatus">${q.audio_url?'✅ MP3 загружен':'⚠ MP3 нет'}</span></div>`).join("")}</div>`);
 document.querySelector('#back').onclick=()=>hostView(state.game);document.querySelector('#back2').onclick=()=>hostView(state.game);document.querySelector('#start').onclick=()=>hostView(state.game);
 document.querySelectorAll('.psave').forEach(btn=>{const row=btn.closest('.prep-row');const file=row.querySelector('.pfile');btn.onclick=()=>file.click();file.onchange=()=>{if(file.files[0]) savePrepRow(row)}});
}
async function savePrepRow(row){
 const id=+row.dataset.id,g=state.game,q=g.questions.find(x=>x.id===id);if(!q)return;
 const category=row.querySelector('.pcat').value,value=+row.querySelector('.pval').value,answer=row.querySelector('.pans').value.trim();
 let audio_url=q.audio_url||null; const file=row.querySelector('.pfile').files[0]; const status=row.querySelector('.pstatus');
 if(file){if(!file.name.toLowerCase().endsWith('.mp3')){status.textContent='❌ Нужен MP3';return}if(file.size>15*1024*1024){status.textContent='❌ MP3 больше 15 МБ';return}status.textContent='⏳ Загружаем MP3…';const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const path=`${g.id}/${id}-${Date.now()}-${safe}`;const {error}=await sb.storage.from('songs').upload(path,file,{contentType:'audio/mpeg',upsert:true});if(error){status.textContent='❌ '+error.message;return}audio_url=sb.storage.from('songs').getPublicUrl(path).data.publicUrl}
 const questions=g.questions.map(x=>x.id===id?{...x,category,value,answer,title:answer||`Мелодия №${id}`,audio_url}:x);const {error}=await saveUndoUpdate({questions});if(error){status.textContent='❌ '+error.message;return}state.game.questions=questions;status.textContent=audio_url?'✅ Сохранено и MP3 загружен':'✅ Сохранено';row.querySelector('.pfile').value='';row.querySelector('.psave').textContent='💾 Заменить MP3';
}
async function saveUndoUpdate(fields){const g=state.game;const undo={questions:g.questions,teams:g.teams,current_question_id:g.current_question_id,locked_team_id:g.locked_team_id,blocked_team_ids:g.blocked_team_ids||[],status:g.status};return sb.from("games").update({...fields,undo_state:undo}).eq("id",g.id)}
async function undoLast(){const g=state.game;if(!g.undo_state)return;stop();const u=g.undo_state;const {error}=await sb.from("games").update({questions:u.questions,teams:u.teams,current_question_id:u.current_question_id??null,locked_team_id:u.locked_team_id??null,blocked_team_ids:u.blocked_team_ids||[],status:u.status||g.status,undo_state:null}).eq("id",g.id);if(error)document.querySelector("#status").textContent="Ошибка отмены: "+error.message}
async function selectQuestion(id){stop();state.answerVisible=false;const g=state.game;const questions=g.questions.map(q=>q.id===id?{...q,used:true}:q);await saveUndoUpdate({questions,current_question_id:id,locked_team_id:null,blocked_team_ids:[]})}
async function play(){const q=state.game.questions.find(x=>x.id===state.game.current_question_id);if(!q)return;if(!q.audio_url){document.querySelector("#status").textContent="⚠ Сначала загрузите MP3 для этой мелодии.";return}stop();state.audio=new Audio(q.audio_url);state.audio.play().catch(()=>{document.querySelector("#status").textContent="Нажмите «Играть» ещё раз — браузер заблокировал автозапуск."})}
function stop(){if(state.audio){state.audio.pause();state.audio.currentTime=0;state.audio=null}}
function showAnswer(){const q=state.game.questions.find(x=>x.id===state.game.current_question_id);document.querySelector("#answer").textContent=q?"Ответ: "+q.answer:""}
async function clearLock(){await saveUndoUpdate({locked_team_id:null})}
async function correctAnswer(){const g=state.game,q=g.questions.find(x=>x.id===g.current_question_id),tid=g.locked_team_id;if(!q||!tid)return;stop();const teams=g.teams.map(t=>t.id===tid?{...t,score:t.score+q.value}:t);await saveUndoUpdate({teams,locked_team_id:null,blocked_team_ids:[]})}
async function wrongAnswer(){const g=state.game,q=g.questions.find(x=>x.id===g.current_question_id),tid=g.locked_team_id;if(!q||!tid)return;stop();const penalty=Math.floor(q.value/2);const teams=g.teams.map(t=>t.id===tid?{...t,score:t.score-penalty}:t);const blocked=Array.from(new Set([...(g.blocked_team_ids||[]),tid]));await saveUndoUpdate({teams,locked_team_id:null,blocked_team_ids:blocked})}
async function resetGame(){if(!confirm("Сбросить игру? Очки и открытые ноты будут сброшены. Это действие можно отменить кнопкой «Отменить»."))return;stop();const qs=state.game.questions.map(q=>({...q,used:false}));const teams=state.game.teams.map(t=>({...t,score:0}));await saveUndoUpdate({questions:qs,teams,current_question_id:null,locked_team_id:null,blocked_team_ids:[]})}
async function uploadMp3(){const q=state.game.questions.find(x=>x.id===state.game.current_question_id);const file=document.querySelector("#mp3").files[0];const out=document.querySelector("#uploadStatus");if(!q||!file)return;if(!file.name.toLowerCase().endsWith(".mp3")){out.textContent="Нужен файл MP3.";return}if(file.size>15*1024*1024){out.textContent="Для этой версии лучше использовать MP3 до 15 МБ.";return}const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");const path=`${state.game.id}/${q.id}-${Date.now()}-${safe}`;out.textContent="Загружаем…";const {error}=await sb.storage.from("songs").upload(path,file,{contentType:"audio/mpeg",upsert:true});if(error){out.textContent="Ошибка: "+error.message;return}const {data}=sb.storage.from("songs").getPublicUrl(path);const questions=state.game.questions.map(x=>x.id===q.id?{...x,audio_url:data.publicUrl}:x);const {error:dbError}=await saveUndoUpdate({questions});if(dbError){out.textContent="MP3 загружен, но не удалось сохранить ссылку: "+dbError.message;return}out.textContent="Готово! MP3 привязан к мелодии."}
function playerJoin(code){const g=state.game;shell(`<div class="card join center"><div class="logo">🎵 Угадай мелодию</div><p class="muted">Комната <b>${esc(code)}</b></p><h2>Выберите свою команду</h2><select id="team"><option value="">— Команда —</option>${g.teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("")}</select><button class="primary" id="join">Подключиться</button><p id="err" class="muted"></p></div>`);document.querySelector("#join").onclick=()=>{const id=+document.querySelector("#team").value;if(!id){document.querySelector("#err").textContent="Выберите команду.";return}state.team=id;playerView(state.game)};}
function playerView(g){const t=g.teams.find(x=>x.id===state.team);const locked=g.locked_team_id;const blocked=g.blocked_team_ids||[];const myBlocked=blocked.includes(state.team);const disabled=!!locked||myBlocked;let text="Слушайте мелодию";if(locked===state.team)text="🥇 ВЫ ПЕРВЫЕ! Ждите вопроса ведущего.";else if(locked)text=`⏳ ${g.teams.find(x=>x.id===locked)?.name||"Другая команда"} отвечает`;else if(myBlocked)text="❌ Вы уже ошиблись. Ждите следующую мелодию.";shell(`<div class="card join center"><div class="muted">КОМАНДА</div><h1>${esc(t?.name||"Команда")}</h1><div class="status">${esc(text)}</div><button id="buzz" class="big" ${disabled?"disabled":""}>🔴 ЖМАК!</button><p class="muted">${disabled?"Кнопка пока недоступна.":"Нажмите как можно быстрее, когда узнаете мелодию."}</p></div>`);document.querySelector("#buzz").onclick=buzz}
async function buzz(){const btn=document.querySelector("#buzz");btn.disabled=true;const g=state.game;if(!g.current_question_id){document.querySelector(".status").textContent="⏳ Ведущий ещё не выбрал мелодию.";btn.disabled=false;return}const {data,error}=await sb.rpc("claim_buzz",{p_game_id:g.id,p_question_id:g.current_question_id,p_team_id:state.team});if(error){btn.disabled=false;document.querySelector(".status").textContent="Ошибка: "+error.message;return}document.querySelector(".status").textContent=data?.won?"🥇 ВЫ ПЕРВЫЕ! Ждите вопроса ведущего.":"⏳ Кто-то успел раньше."}
function subscribe(){if(state.sub)sb.removeChannel(state.sub);state.sub=sb.channel("game-"+state.game.id).on("postgres_changes",{event:"UPDATE",schema:"public",table:"games",filter:"id=eq."+state.game.id},p=>{const old=state.game;state.game=p.new;if(params.has("host")){if(old?.locked_team_id!==p.new.locked_team_id&&p.new.locked_team_id)stop();hostView(state.game)}else playerView(state.game)}).subscribe()}
async function boot(){if(!configured){needConfig();return}try{if(params.has("host")){await loadGame(params.get("host"));subscribe();hostView(state.game)}else if(params.has("player")){await loadGame(params.get("player"));subscribe();playerJoin(params.get("player"))}else hostSetup()}catch(e){shell(`<div class="card join"><h2>Ошибка</h2><p>${esc(e.message)}</p></div>`)} }
boot();
</script></body></html>
