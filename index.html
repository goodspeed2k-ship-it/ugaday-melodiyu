/* V16 — удобная подготовка 5×5 */
.prep-shell{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start;margin-top:18px;width:100%}
.prep-table-card{min-width:0;width:100%}
.prep-grid{display:grid;grid-template-columns:58px repeat(5,minmax(0,1fr));gap:7px;width:100%;min-width:0}
.prep-corner,.prep-head,.prep-value,.prep-cell{min-width:0;border:1px solid var(--line);border-radius:12px}
.prep-corner{display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--muted);padding:8px}
.prep-head{background:#1b1e27;padding:8px}
.prep-head .cat-input{width:100%;padding:9px 7px;font-size:14px}
.prep-head .cat-head-label{margin-top:5px;font-size:10px}
.prep-value{display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;background:#1b1e27;padding:8px}
.prep-cell{min-height:116px;padding:8px;display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:.12s;background:#15161c}
.prep-cell:hover{border-color:#666f7e;transform:translateY(-1px)}
.prep-cell.selected{border-color:#fff;box-shadow:0 0 0 2px #ffffff18}
.prep-cell.ready{background:linear-gradient(180deg,#102319,#14191a)}

.prep-cell-top b{font-size:18px}

.prep-status{font-size:10px;font-weight:900;white-space:nowrap}
.prep-editor{position:sticky;top:14px;width:100%;height:max-content}
.prep-editor .card{width:100%}
.editor-field input{font-size:15px}
.editor-actions{display:grid;grid-template-columns:1fr;gap:8px}
.editor-actions button{width:100%}
.prep-progress{margin-left:4px}

  .prep-shell{grid-template-columns:1fr}
  .prep-editor{position:static}
}
@media(max-width:760px){

/* V17 — компактная подготовка без горизонтальной прокрутки; редактор как модальное окно */
.prep-shell{display:block;width:100%;margin-top:18px}
.prep-table-card{width:100%;min-width:0}
.prep-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;width:100%;min-width:0}
.prep-corner,.prep-value{display:none!important}
.prep-head{background:#1b1e27;border:1px solid var(--line);border-radius:12px;padding:7px;min-width:0}
.prep-head .cat-input{width:100%;box-sizing:border-box;padding:9px 6px;font-size:14px}
.prep-cell{min-width:0;min-height:108px;padding:9px;display:flex;flex-direction:column;gap:5px;cursor:pointer;background:#15161c;border:1px solid var(--line);border-radius:12px;transition:.12s}
.prep-cell:hover{border-color:#737d8d;transform:translateY(-1px)}
.prep-cell.selected{border-color:#fff;box-shadow:0 0 0 2px #ffffff22}
.prep-cell.ready{background:linear-gradient(180deg,#11271b,#141a17);border-color:#2b6844}
.prep-cell.missing{background:#15161c}
.prep-cell-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.prep-cell-top b{font-size:18px}
.prep-status{font-size:10px;font-weight:900;white-space:nowrap}
.prep-cell .song-mini{font-size:13px;font-weight:800;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:31px;margin:1px 0}
.prep-cell .small{font-size:11px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prep-cell::after{content:'Нажмите для редактирования';margin-top:auto;font-size:10px;color:var(--muted)}
.prep-editor{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:1002;width:min(560px,calc(100vw - 36px));max-height:calc(100vh - 36px);overflow:auto;background:#15161c;border:1px solid #484e5a;border-radius:18px;padding:18px;box-shadow:0 25px 80px rgba(0,0,0,.65);display:none}
.prep-editor.open{display:block}
.prep-editor::before{content:'';position:fixed;inset:0;z-index:-1;background:rgba(0,0,0,.68)}
.prep-editor .prep-close{position:absolute;right:14px;top:14px}
.prep-editor h3{padding-right:90px;margin:0 0 10px}
.prep-editor .editor-actions{display:grid;grid-template-columns:1fr;gap:8px}
.prep-editor .editor-actions button{width:100%}
@media(max-width:700px){
  .prep-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
  .prep-cell{min-height:100px}
}

function playerView(g){if(!state.team){playerJoin(g.code);return}const t=g.teams.find(x=>x.id===state.team),locked=g.locked_team_id,target=g.target_team_id,blocked=g.blocked_team_ids||[],s=g.game_settings||{},myBlocked=blocked.includes(state.team);const disabled=!!locked||myBlocked||(!s.roundActive)||((target??null)!==null&&target!==state.team);let text=!s.roundActive?(s.final?'🏆 Финал':'⏳ Раунд ещё не начался'):'Слушайте мелодию';if(target===state.team)text='🎒 Вам передали песню — будьте готовы нажать СТОП!';else if(locked===state.team)text='✅ Ваша команда нажала первой. Ждите вопроса ведущего.';else if(locked)text=`⏳ Отвечает команда «${g.teams.find(x=>x.id===locked)?.name||'другая'}»`;else if(myBlocked)text='❌ Вы уже ошиблись. Ждите следующую мелодию.';shell(`<div class="card join center"><div class="muted">РАУНД ${s.round||1}</div><h1>${esc(t?.name||'Команда')}</h1><div class="player-name">👤 ${esc(state.playerName||'Участник')}</div><div class="status">${esc(text)}</div><button id="buzz" class="big" ${disabled?'disabled':''}>🔴 СТОП!</button><p class="muted">${disabled?'Кнопка пока недоступна.':'Нажмите как можно быстрее, когда узнаете мелодию.'}</p><hr style="border-color:#30343f"><div class="player-count">В команде ${(t?.players||[]).length} участников</div></div>`);document.querySelector('#buzz').onclick=buzz}
async function buzz(){const btn=document.querySelector('#buzz');if(!btn)return;btn.disabled=true;const g=state.game;if(!g.current_question_id){document.querySelector('.status').textContent='⏳ Ведущий ещё не выбрал мелодию.';btn.disabled=false;return}const {data,error}=await sb.rpc('claim_buzz',{p_game_id:g.id,p_question_id:g.current_question_id,p_team_id:state.team});if(error){btn.disabled=false;document.querySelector('.status').textContent='Ошибка: '+error.message;return}document.querySelector('.status').textContent=data?.won?'✅ Ваша команда нажала первой. Ждите вопроса ведущего.':'⏳ Кто-то успел раньше.'}
function subscribe(){if(state.sub)sb.removeChannel(state.sub);state.sub=sb.channel('game-'+state.game.id).on('postgres_changes',{event:'UPDATE',schema:'public',table:'games',filter:'id=eq.'+state.game.id},p=>{const old=state.game;state.game=p.new;state.game.blocked_team_ids=state.game.blocked_team_ids||[];state.game.game_settings=state.game.game_settings||{};if(old?.locked_team_id!==p.new.locked_team_id&&p.new.locked_team_id)stop();if(params.has('host'))hostView(state.game);else playerView(state.game)}).subscribe()}
async function boot(){if(!configured){needConfig();return}try{if(params.has('host')){await loadGame(params.get('host'));subscribe();hostView(state.game)}else if(params.has('player')){await loadGame(params.get('player'));subscribe();playerJoin(params.get('player'))}else hostSetup()}catch(e){shell(`<div class="card join"><h2>Ошибка</h2><p>${esc(e.message)}</p></div>`)}}
boot();</script></body></html>
