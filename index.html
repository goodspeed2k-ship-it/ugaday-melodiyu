ed?'disabled':''}>🔴 СТОП!</button><p class="muted">${disabled?'Кнопка пока недоступна.':'Нажмите как можно быстрее, когда узнаете мелодию.'}</p><hr style="border-color:#30343f"><div class="player-count">В команде ${(t?.players||[]).length} участников</div></div>`);document.querySelector('#buzz').onclick=buzz}
async function buzz(){const btn=document.querySelector('#buzz');if(!btn)return;btn.disabled=true;const g=state.game;if(!g.current_question_id){document.querySelector('.status').textContent='⏳ Ведущий ещё не выбрал мелодию.';btn.disabled=false;return}const {data,error}=await sb.rpc('claim_buzz',{p_game_id:g.id,p_question_id:g.current_question_id,p_team_id:state.team});if(error){btn.disabled=false;document.querySelector('.status').textContent='Ошибка: '+error.message;return}document.querySelector('.status').textContent=data?.won?'✅ Ваша команда нажала первой. Ждите вопроса ведущего.':'⏳ Кто-то успел раньше.'}
function openBagTest(){
 state.inBagTest=true;
 stop();
 const g=state.game||{};
 const teams=(g.teams&&g.teams.length?g.teams:[1,2,3].map(id=>({id,name:'Команда '+id,score:0}))).slice(0,3);
 const names=teams.map(t=>t.name);
 const ids=teams.map(t=>t.id);
 window.__bagTest={owner:ids[0],target:null,locked:null,blocked:[],phase:'choose',log:[],names,ids};
 const q=currentQuestion(g);
 const hasAudio=!!q?.audio_url;
 shell(`<div class="bag-test-overlay"><div class="bag-test-shell">
 <div class="top"><div><div class="logo">🧪 Тест «Песни в мешке»</div><div class="muted">Локальный тестовый стенд. База данных и текущая игра не изменяются.</div></div><button id="bagTestClose">✕ Закрыть тест</button></div>
 <div class="card" style="margin-top:14px"><div class="row"><span class="bag-test-pill">Владелец: ${esc(names[0]||'Команда 1')}</span><span class="bag-test-pill">MP3 текущей песни: ${hasAudio?'есть':'нет — тестируем механику'}</span></div><div id="bagTestStatus" class="bag-test-state">🎒 Открыта «Песня в мешке». Выберите действие ведущего.</div>
 <div class="bag-test-actions"><div class="row"><button class="primary" id="bagTestKeep">✅ Оставить себе (${esc(names[0]||'Команда 1')})</button>${teams.slice(1).map(t=>`<button id="bagTestGive${t.id}">↪ Передать ${esc(t.name)}</button>`).join('')}</div><div class="row"><button class="good" id="bagTestNew">↻ Новый сценарий</button></div></div></div>
 <div class="bag-test-grid" style="margin-top:12px"><div class="bag-test-card"><h3>🎙 Ведущий</h3><div class="muted">Все действия здесь имитируются локально.</div><div id="bagHostInfo" class="bag-test-log"></div><div class="row" style="margin-top:10px"><button class="good" id="bagCorrect">✅ Правильно</button><button class="bad" id="bagWrong">❌ Неправильно</button></div></div>
 ${teams.map(t=>`<div class="bag-test-card"><h3>📱 ${esc(t.name)}</h3><div id="bagTeamState${t.id}" class="bag-test-state">⏳ Кнопка недоступна</div><button class="big bag-test-buzz" id="bagBuzz${t.id}" disabled>🔴 СТОП!</button></div>`).join('')}</div>
 </div></div>`);
 document.querySelector('#bagTestClose').onclick=closeBagTest;
 document.querySelector('#bagTestKeep').onclick=bagTestKeep;
 teams.slice(1).forEach(t=>{const b=document.querySelector('#bagTestGive'+t.id);if(b)b.onclick=()=>bagTestGive(t.id)});
 document.querySelector('#bagTestNew').onclick=bagTestReset;
 document.querySelector('#bagCorrect').onclick=()=>bagTestResolve(true);
 document.querySelector('#bagWrong').onclick=()=>bagTestResolve(false);
 teams.forEach(t=>{const b=document.querySelector('#bagBuzz'+t.id);if(b)b.onclick=()=>bagTestBuzz(t.id)});
 bagTestRender();
}
function closeBagTest(){state.inBagTest=false;hostView(state.game)}
function bagTestReset(){const teams=(state.game?.teams||[]).slice(0,3);const names=teams.length?teams.map(t=>t.name):['Команда 1','Команда 2','Команда 3'];const ids=teams.length?teams.map(t=>t.id):[1,2,3];window.__bagTest={owner:ids[0],target:null,locked:null,blocked:[],phase:'choose',log:[],names,ids};bagTestRender()}
function bagTestKeep(){const t=window.__bagTest;if(!t)return;t.target=Number(t.owner);t.locked=null;t.blocked=[];t.phase='answer';t.log.unshift('✅ Песня оставлена владельцу. STOP активен только у владельца.');bagTestRender()}
function bagTestGive(id){const t=window.__bagTest;if(!t)return;t.target=id;t.locked=null;t.blocked=[];t.phase='answer';t.log.unshift('↪ Песня передана '+(t.names[(t.ids||[]).indexOf(id)]||('Команде '+id))+'. STOP активен только у получателя.');bagTestRender()}
function bagTestBuzz(id){const t=window.__bagTest;if(!t||t.phase!=='answer'||t.blocked.includes(id)||t.locked)return;if(t.target&&t.target!==id)return;t.locked=id;t.log.unshift('🔴 '+(t.names[(t.ids||[]).indexOf(id)]||('Команда '+id))+' нажала STOP.');bagTestRender()}
function bagTestResolve(correct){const t=window.__bagTest;if(!t||!t.locked)return;t.log.unshift(correct?'✅ Правильно — команда получает очки.':'❌ Ошибка — команда блокируется на эту песню.');if(correct){t.phase='done';t.target=null;t.locked=null;t.blocked=[]}else{t.blocked=[...new Set([...t.blocked,t.locked])];t.locked=null;t.target=null;t.phase='answer';}bagTestRender()}
function bagTestRender(){const t=window.__bagTest;if(!t)return;const status=document.querySelector('#bagTestStatus'),host=document.querySelector('#bagHostInfo');if(!status)return;let s=t.phase==='choose'?'🎒 Открыта «Песня в мешке». Выберите действие ведущего.':t.phase==='done'?'🏁 Сценарий завершён. Нажмите «Новый сценарий».':t.locked?'🎙 Отвечает команда «'+esc(t.names[(t.ids||[]).indexOf(t.locked)]||('Команда '+t.locked))+'»':t.target===t.owner?'🎒 Песня остаётся у команды «'+esc(t.names[(t.ids||[]).indexOf(t.owner)]||('Команда '+t.owner))+'»':t.target?'🎒 Песня передана команде «'+esc(t.names[(t.ids||[]).indexOf(t.target)]||('Команда '+t.target))+'»':'🎵 После ошибки остальные команды снова могут нажать STOP.';status.innerHTML=s;host.innerHTML=t.log.slice(0,8).map(x=>`<div>${esc(x)}</div>`).join('')||'Действия пока не выполнялись.';for(const id of (t.ids||[1,2,3])){const b=document.querySelector('#bagBuzz'+id),el=document.querySelector('#bagTeamState'+id);if(!b||!el)continue;const active=t.phase==='answer'&&!t.locked&&!t.blocked.map(Number).includes(Number(id))&&(!t.target||Number(t.target)===Number(id));b.disabled=!active;el.textContent=t.blocked.map(Number).includes(Number(id))?'❌ Заблокирована до следующей песни':active?'🟢 СТОП активна':'⏳ Кнопка недоступна';el.className='bag-test-state '+(active?'bag-test-good':t.blocked.includes(id)?'bag-test-danger':'bag-test-warn');}const cr=document.querySelector('#bagCorrect'),wr=document.querySelector('#bagWrong');if(cr)cr.disabled=!t.locked;if(wr)wr.disabled=!t.locked;}

function subscribe(){if(state.sub)sb.removeChannel(state.sub);state.sub=sb.channel('game-'+state.game.id).on('postgres_changes',{event:'UPDATE',schema:'public',table:'games',filter:'id=eq.'+state.game.id},p=>{const old=state.game;state.game=p.new;state.game.blocked_team_ids=state.game.blocked_team_ids||[];state.game.game_settings=state.game.game_settings||{};const ra=state.game.game_settings.remoteAction;if((params.has('display')||params.has('host'))&&ra&&ra.id!==state.lastRemoteActionId)handleRemoteAction(state.game,ra);if(old?.locked_team_id!==p.new.locked_team_id&&p.new.locked_team_id){if(state.preserveAudioOnLock){state.preserveAudioOnLock=false}else stop();}if(params.has('host')){if(state.inBagTest||state.viewMode==='preparation'||state.inPreparation)return;hostView(state.game)}else if(params.has('display'))displayView(state.game);else if(params.has('controller'))controllerView(state.game);else playerView(state.game)}).subscribe()}
async function boot(){if(!configured){needConfig();return}try{if(params.has('pwa')){const code=localStorage.getItem('ugaday-last-controller');if(code){location.replace('./?controller='+encodeURIComponent(code));return}}if(params.has('controller')){await loadGame(params.get('controller'));state.isController=true;subscribe();controllerView(state.game)}else if(params.has('display')){await loadGame(params.get('display'));state.displayMode=true;subscribe();displayView(state.game)}else if(params.has('host')){await loadGame(params.get('host'));subscribe();hostView(state.game)}else if(params.has('player')){await loadGame(params.get('player'));subscribe();playerJoin(params.get('player'))}else hostSetup()}catch(e){shell(`<div class="card join"><h2>Ошибка</h2><p>${esc(e.message)}</p></div>`)}}
boot();</script></body></html>
