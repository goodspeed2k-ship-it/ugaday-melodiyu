<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Угадай мелодию</title>
<style>
:root{--bg:#0b0c10;--card:#15171d;--line:#30333d;--text:#f7f7f8;--muted:#a6a8b1;--accent:#fff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1b1d26,#0b0c10 55%);color:var(--text);font:16px Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.logo{font-size:30px;font-weight:900}.muted{color:var(--muted)}.card{background:#12141aee;border:1px solid var(--line);border-radius:18px;padding:18px}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:18px 0}.note{min-height:82px;border:1px solid #3a3d48;background:#1b1e27;color:#fff;border-radius:14px;font-size:26px;font-weight:900;cursor:pointer}.note.used{opacity:.2;cursor:default}.scores{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.team{background:#171920;border:1px solid var(--line);border-radius:14px;padding:14px}.team b{display:block;margin-bottom:7px}.pts{font-size:28px;font-weight:900}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}button,input{font:inherit}button{min-height:44px;border-radius:11px;border:1px solid var(--line);background:#20232b;color:#fff;padding:10px 15px;font-weight:800;cursor:pointer}button.primary{background:#fff;color:#111}button:disabled{opacity:.45;cursor:not-allowed}.big{font-size:32px;padding:26px 38px;border-radius:18px;background:#fff;color:#111;font-weight:900}.center{text-align:center}.hidden{display:none}.status{font-size:19px;font-weight:700;margin:8px 0}.answer{font-size:25px;font-weight:900;margin:15px 0}.join{max-width:520px;margin:50px auto}.join input{width:100%;padding:14px;border-radius:10px;border:1px solid var(--line);background:#0e1015;color:#fff;margin:7px 0}.code{font-size:38px;font-weight:900;letter-spacing:5px}.winner{font-size:30px;font-weight:900;margin:15px 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}@media(max-width:700px){.board{grid-template-columns:repeat(3,1fr)}.scores{grid-template-columns:repeat(2,1fr)}.logo{font-size:24px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body><div id="app" class="wrap"></div>
<script>
const CONFIG={url:"https://rplawiqtrscavsvehtua.supabase.co",key:"sb_publishable__D2sRKa4baHynamcd-MQoQ_Tb-pRiEx"};
const configured=!CONFIG.url.startsWith("PASTE_")&&!CONFIG.key.startsWith("PASTE_");
const sb=configured?supabase.createClient(CONFIG.url,CONFIG.key,{auth:{persistSession:false}}):null;
const app=document.querySelector("#app");
const params=new URLSearchParams(location.search);
let state={game:null,team:null,question:null,locked:false,sub:null,audio:null};
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function shell(html){app.innerHTML=html}
function needConfig(){shell(`<div class="card join center"><h1>Угадай мелодию</h1><p class="muted">Демо готово. Осталось подключить Supabase.</p><p>Открой файл <b>index.html</b> и вставь URL проекта и Publishable Key в блок <b>CONFIG</b>.</p><p class="muted">SQL для базы лежит рядом в файле <b>supabase.sql</b>.</p></div>`)}
function hostSetup(){shell(`<div class="card join"><h1>🎙 Создать игру</h1><p class="muted">Ты — ведущий. После создания получишь код и ссылки для команд.</p><input id="title" placeholder="Название игры" value="Угадай мелодию"><input id="teams" type="number" min="2" max="8" value="4"><button class="primary" id="create">Создать игру</button><p id="err" class="muted"></p></div>`);document.querySelector("#create").onclick=createGame}
async function createGame(){const title=document.querySelector("#title").value.trim()||"Угадай мелодию";const n=Math.max(2,Math.min(8,+document.querySelector("#teams").value||4));const code=Math.random().toString(36).slice(2,6).toUpperCase();const teams=Array.from({length:n},(_,i)=>({id:i+1,name:`Команда ${i+1}`,score:0}));const questions=Array.from({length:25},(_,i)=>({id:i+1,value:(i%5+1)*100,title:`Мелодия №${i+1}`,answer:["Руки Вверх! — Крошка моя","Иванушки International — Тополиный пух","Звери — Районы-кварталы","Кино — Группа крови","МакSим — Знаешь ли ты"][i%5],audio_url:null,used:false}));const {data,error}=await sb.from("games").insert({code,title,teams,questions,status:"lobby"}).select().single();if(error){document.querySelector("#err").textContent=error.message;return}location.search="?host="+data.code}
async function loadGame(code){const {data,error}=await sb.from("games").select("*").eq("code",code).single();if(error)throw error;state.game=data;return data}
function hostView(g){const q=g.questions.find(x=>x.id===g.current_question_id);shell(`<div class="top"><div><div class="logo">🎵 ${esc(g.title)}</div><div class="muted">Код комнаты: <b>${g.code}</b> · игрокам: ?player=${g.code}</div></div><button id="reset">Сброс</button></div><div class="card center" style="margin-top:18px"><div class="muted">ТЕКУЩАЯ МЕЛОДИЯ</div><h1>${q?esc(q.title):"Выберите ноту"}</h1><div id="status" class="status">${g.locked_team_id?`🥇 ${esc(g.teams[g.locked_team_id-1]?.name||"Команда")} отвечает`:"Готовы к игре"}</div><div class="actions" style="justify-content:center"><button class="primary" id="play" ${q?"":"disabled"}>▶ Играть</button><button id="stop" ${q?"":"disabled"}>⏹ Стоп</button><button id="answer" ${q?"":"disabled"}>👀 Показать ответ</button><button id="clear" ${q?"":"disabled"}>Следующая команда</button></div><div id="answer" class="answer"></div></div><div class="board">${g.questions.map(q=>`<button class="note ${q.used?'used':''}" data-id="${q.id}" ${q.used?'disabled':''}>${q.value}</button>`).join("")}</div><div class="scores">${g.teams.map(t=>`<div class="team"><b>${esc(t.name)}</b><div class="pts">${t.score}</div></div>`).join("")}</div>`);document.querySelectorAll(".note").forEach(b=>b.onclick=()=>selectQuestion(+b.dataset.id));document.querySelector("#play").onclick=play;document.querySelector("#stop").onclick=stop;document.querySelector("#answer").onclick=showAnswer;document.querySelector("#clear").onclick=clearLock;document.querySelector("#reset").onclick=resetGame}
async function selectQuestion(id){const g=state.game;const questions=g.questions.map(q=>q.id===id?{...q,used:true}:q);await sb.from("games").update({questions,current_question_id:id,locked_team_id:null}).eq("id",g.id)}
async function play(){const q=state.game.questions.find(x=>x.id===state.game.current_question_id);if(!q)return;if(!q.audio_url){document.querySelector("#status").textContent="🎵 В этой демо-песне пока нет MP3. Музыкальный модуль подключим следующим шагом.";return}if(!state.audio)state.audio=new Audio(q.audio_url);state.audio.currentTime=0;state.audio.play()}
function stop(){if(state.audio){state.audio.pause();state.audio.currentTime=0}}
function showAnswer(){const q=state.game.questions.find(x=>x.id===state.game.current_question_id);document.querySelector("#answer").textContent=q?"Ответ: "+q.answer:""}
async function clearLock(){await sb.from("games").update({locked_team_id:null}).eq("id",state.game.id)}
async function resetGame(){if(!confirm("Сбросить игру?"))return;const qs=state.game.questions.map(q=>({...q,used:false}));await sb.from("games").update({questions:qs,current_question_id:null,locked_team_id:null}).eq("id",state.game.id)}
function playerJoin(code){shell(`<div class="card join"><h1>🔴 ЖМАК!</h1><p class="muted">Игра: ${esc(code)}</p><input id="name" placeholder="Название команды"><button class="primary" id="join">Подключиться</button><p id="err" class="muted"></p></div>`);document.querySelector("#join").onclick=async()=>{const name=document.querySelector("#name").value.trim();if(!name)return;const g=await loadGame(code);const idx=g.teams.findIndex(t=>t.name.toLowerCase()===name.toLowerCase());if(idx<0){document.querySelector("#err").textContent="Такой команды нет. Введи точное название.";return}state.team=idx+1;playerView(g)}
}
function playerView(g){const t=g.teams[state.team-1];shell(`<div class="card center join"><div class="muted">КОМАНДА</div><h1>${esc(t.name)}</h1><p id="pstatus" class="status">Слушайте мелодию</p><button id="buzz" class="big">🔴 ЖМАК!</button><p class="hint muted">Кнопка станет недоступна после вашего нажатия.</p></div>`);document.querySelector("#buzz").onclick=buzz}
async function buzz(){const btn=document.querySelector("#buzz");btn.disabled=true;const g=state.game;const {data,error}=await sb.rpc("claim_buzz",{p_game_id:g.id,p_question_id:g.current_question_id,p_team_id:state.team});if(error){btn.disabled=false;document.querySelector("#pstatus").textContent="Ошибка: "+error.message;return}document.querySelector("#pstatus").textContent=data?.won?"🥇 ВЫ ПЕРВЫЕ! Ждите вопроса ведущего.":"⏳ Кто-то успел раньше."}
async function boot(){if(!configured){needConfig();return}try{if(params.has("host")){await loadGame(params.get("host"));subscribe();hostView(state.game)}else if(params.has("player")){await loadGame(params.get("player"));playerJoin(params.get("player"));subscribe()}else hostSetup()}catch(e){shell(`<div class="card join"><h2>Ошибка</h2><p>${esc(e.message)}</p></div>`)}}
function subscribe(){if(state.sub)state.sub.unsubscribe();state.sub=sb.channel("game-"+state.game.id).on("postgres_changes",{event:"UPDATE",schema:"public",table:"games",filter:"id=eq."+state.game.id},p=>{state.game=p.new;if(params.has("host")){stop();hostView(state.game)}else playerView(state.game)}).subscribe()}
boot();
</script></body></html>
