<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Угадай мелодию — V3</title>
<style>
:root{--bg:#090a0e;--card:#12141aee;--line:#30343f;--text:#f7f7f8;--muted:#a6a8b1;--red:#e21b2d;--green:#27c46a;--gold:#ffc928;--blue:#2c6bed}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1b1d27,#090a0e 58%);color:var(--text);font:16px Arial,sans-serif}.wrap{max-width:1280px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.logo{font-size:30px;font-weight:900}.muted{color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}.join{max-width:760px;margin:50px auto}.center{text-align:center}.hidden{display:none!important}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}.actions.center{justify-content:center}button,input,select,textarea{font:inherit}button{min-height:44px;border-radius:11px;border:1px solid var(--line);background:#20232b;color:#fff;padding:10px 15px;font-weight:800;cursor:pointer}button.primary{background:#fff;color:#111}button.good{background:#153d28;border-color:#267a4b}button.bad{background:#45171d;border-color:#8d2834}button.blue{background:#182d5b;border-color:#315bb4}button:disabled{opacity:.45;cursor:not-allowed}input,select,textarea{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#0e1015;color:#fff}input[type=file]{padding:7px}.setup-team{display:flex;gap:8px;margin:7px 0}.setup-team input{flex:1}.code{font-size:34px;font-weight:900;letter-spacing:5px}.host-grid{display:grid;grid-template-columns:1fr 310px;gap:14px;margin-top:18px}.status{font-size:20px;font-weight:800;margin:9px 0}.answer{font-size:25px;font-weight:900;margin:15px 0;min-height:30px}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:18px 0}.note{min-height:92px;border:1px solid #3a3d48;background:#1b1e27;color:#fff;border-radius:14px;font-size:26px;font-weight:900;cursor:pointer}.note.used{opacity:.18;cursor:default}.cat{font-size:13px;color:#c8cad1;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}.scores{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.team{background:#171920;border:1px solid var(--line);border-radius:14px;padding:14px}.team b{display:block;margin-bottom:7px}.pts{font-size:28px;font-weight:900}.qr{background:#fff;padding:10px;border-radius:12px;width:190px;height:190px;margin:auto}.linkbox{word-break:break-all;background:#0d0f14;padding:10px;border-radius:10px;font-size:13px}.big{font-size:34px;padding:28px 42px;border-radius:20px;background:var(--red);color:#fff;border:2px solid #ff5a67;font-weight:900;box-shadow:0 8px 35px #e21b2d44}.winner{font-size:30px;font-weight:900;margin:15px 0}.flash{font-size:28px;font-weight:900;padding:12px;border-radius:12px;margin-top:12px;background:#2b2024}.editor{display:grid;gap:10px}.song-row{display:grid;grid-template-columns:55px 1.1fr 70px 1.2fr 1.2fr auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px;background:#171920}.song-row .num{font-size:22px;font-weight:900;text-align:center}.song-row input,.song-row select{width:100%;min-width:0}.song-row .file{font-size:12px}.ready{color:#61df91;font-weight:800}.notready{color:#ff9ba4;font-weight:800}.help{background:#171920;border:1px solid var(--line);padding:12px;border-radius:12px;line-height:1.45}.section-title{font-size:21px;font-weight:900;margin:4px 0 12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.check{display:flex;align-items:center;gap:8px}.check input{width:auto}.small{font-size:13px}
@media(max-width:1000px){.host-grid{grid-template-columns:1fr}.scores{grid-template-columns:repeat(3,1fr)}.song-row{grid-template-columns:45px 1fr 70px 1fr 1fr}.song-row .file,.song-row button{grid-column:auto}}
@media(max-width:700px){.board{grid-template-columns:repeat(3,1fr)}.scores{grid-template-columns:repeat(2,1fr)}.logo{font-size:24px}.grid2{grid-template-columns:1fr}.song-row{grid-template-columns:45px 1fr 70px}.song-row input,.song-row select{grid-column:2/4}.song-row button{grid-column:2/4}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body><div id="app" class="wrap"></div>
<script>
const CONFIG={url:"https://rplawiqtrscavsvehtua.supabase.co",key:"sb_publishable__D2sRKa4baHynamcd-MQoQ_Tb-pRiEx"};
const sb=supabase.createClient(CONFIG.url,CONFIG.key,{auth:{persistSession:false}});const app=document.querySelector('#app');const params=new URLSearchParams(location.search);
let state={game:null,team:null,sub:null,audio:null,answerVisible:false};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const playerUrl=code=>location.origin+location.pathname+'?player='+encodeURIComponent(code);
function shell(h){app.innerHTML=h}
function cats(){return ['Русский рок','Поп-хиты','Хиты 90-х','Дискотека','Кино и ТВ']}
function makeQuestions(){const c=cats(), out=[];for(let r=0;r<5;r++)for(let col=0;col<5;col++){const id=r*5+col+1;out.push({id,value:(col+1)*100,category:c[col],title:'Мелодия №'+id,answer:'',audio_url:null,used:false});}return out}
function hostSetup(){shell(`<div class="card join"><div class="logo">🎵 Угадай мелодию</div><p class="muted">Создание новой игры</p><div class="grid2"><div><label>Название игры</label><input id="title" value="Угадай мелодию" placeholder="Название"></div><div><label>Количество команд</label><input id="teams" type="number" min="2" max="6" value="4"></div></div><div id="teamNames"></div><div class="actions"><button class="primary" id="create">Создать игру</button></div><p id="err" class="muted"></p></div>`);document.querySelector('#teams').oninput=renderTeamInputs;renderTeamInputs();document.querySelector('#create').onclick=createGame}
function renderTeamInputs(){const n=Math.max(2,Math.min(6,+document.querySelector('#teams').value||4));document.querySelector('#teamNames').innerHTML='<div class="section-title" style="margin-top:18px">Команды</div>'+Array.from({length:n},(_,i)=>`<div class="setup-team"><b style="width:28px">${i+1}</b><input id="tn${i}" placeholder="Команда ${i+1}" value="Команда ${i+1}"></div>`).join('')}
async function createGame(){const title=document.querySelector('#title').value.trim()||'Угадай мелодию';const n=Math.max(2,Math.min(6,+document.querySelector('#teams').value||4));const code=Math.random().toString(36).slice(2,6).toUpperCase();const teams=Array.from({length:n},(_,i)=>({id:i+1,name:document.querySelector('#tn'+i).value.trim()||'Команда '+(i+1),score:0}));const {data,error}=await sb.from('games').insert({code,title,teams,questions:makeQuestions(),status:'setup',blocked_team_ids:[],current_question_id:null,locked_team_id:null}).select().single();if(error){document.querySelector('#err').textContent=error.message;return}location.search='?edit='+data.code}
async function loadGame(code){const {data,error}=await sb.from('games').select('*').eq('code',code).single();if(error)throw error;data.blocked_team_ids=data.blocked_team_ids||[];state.game=data;return data}
function subscribe(){if(state.sub)sb.removeChannel(state.sub);state.sub=sb.channel('game-'+state.game.id).on('postgres_changes',{event:'UPDATE',schema:'public',table:'games',filter:'id=eq.'+state.game.id},p=>{const old=state.game;state.game=p.new;if(params.has('host')){if(old?.locked_team_id!==p.new.locked_team_id&&p.new.locked_team_id)stop();hostView(state.game)}else if(params.has('player'))playerView(state.game);}).subscribe()}
function editorView(g){shell(`<div class="top"><div><div class="logo">🎙 Подготовка игры</div><div>Код комнаты: <b class="code">${g.code}</b></div></div><div class="actions"><button id="back">← На главную</button></div></div><div class="card" style="margin-top:18px"><div class="section-title">${esc(g.title)}</div><div class="help">Заполни 25 мелодий. <b>Исполнитель/название</b> — для ответа ведущего. MP3 можно загружать прямо здесь. Когда всё готово, нажми <b>«Начать игру»</b>.</div><div class="actions"><button class="good" id="start">▶ Начать игру</button><button id="saveAll">💾 Сохранить изменения</button></div><p id="saveMsg" class="small muted"></p></div><div class="card" style="margin-top:14px"><div class="section-title">Игровое поле</div><div id="editor" class="editor"></div></div>`);renderEditor(g);document.querySelector('#back').onclick=()=>{location.search=''};document.querySelector('#saveAll').onclick=saveEditor;document.querySelector('#start').onclick=startGame}
function renderEditor(g){const c=cats();document.querySelector('#editor').innerHTML=g.questions.map(q=>`<div class="song-row"><div class="num">${q.id}</div><select data-f="category" data-id="${q.id}">${c.map(x=>`<option ${x===q.category?'selected':''}>${esc(x)}</option>`).join('')}</select><input data-f="value" data-id="${q.id}" type="number" step="100" min="100" max="500" value="${q.value}"><input data-f="answer" data-id="${q.id}" placeholder="Исполнитель — Песня" value="${esc(q.answer)}"><input data-f="title" data-id="${q.id}" placeholder="Подпись (необязательно)" value="${esc(q.title)}"><div><input class="file" data-file="${q.id}" type="file" accept="audio/mpeg,audio/mp3,.mp3"><div class="small ${q.audio_url?'ready':'notready'}">${q.audio_url?'✓ MP3 загружен':'○ MP3 нет'}</div></div></div>`).join('')}
function collectEditor(){return state.game.questions.map(q=>{const o={...q};document.querySelectorAll(`[data-id="${q.id}"]`).forEach(el=>{if(el.dataset.f==='value')o.value=+el.value||q.value;else o[el.dataset.f]=el.value.trim()});return o})}
async function saveEditor(){const msg=document.querySelector('#saveMsg');const questions=collectEditor();msg.textContent='Сохраняем…';const {error}=await sb.from('games').update({questions}).eq('id',state.game.id);if(error){msg.textContent='Ошибка: '+error.message;return}state.game.questions=questions;msg.textContent='✓ Изменения сохранены.'}
async function uploadQuestionFile(qid,file){if(!file)return;if(!file.name.toLowerCase().endsWith('.mp3'))throw new Error('Нужен MP3');if(file.size>15*1024*1024)throw new Error('MP3 должен быть до 15 МБ');const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const path=`${state.game.id}/${qid}-${Date.now()}-${safe}`;const {error}=await sb.storage.from('songs').upload(path,file,{contentType:'audio/mpeg',upsert:true});if(error)throw error;return sb.storage.from('songs').getPublicUrl(path).data.publicUrl}
async function startGame(){await saveEditor();const {error}=await sb.from('games').update({status:'lobby',current_question_id:null,locked_team_id:null,blocked_team_ids:[]}).eq('id',state.game.id);if(error){alert(error.message);return}location.search='?host='+state.game.code}
async function selectQuestion(id){stop();const q=state.game.questions.find(x=>x.id===id);if(!q)return;const questions=state.game.questions.map(x=>x.id===id?{...x,used:true}:x);await sb.from('games').update({questions,current_question_id:id,locked_team_id:null,blocked_team_ids:[]}).eq('id',state.game.id)}
function hostView(g){const q=g.questions.find(x=>x.id===g.current_question_id);const locked=g.locked_team_id;const lockedName=locked?g.teams.find(t=>t.id===locked)?.name:'';shell(`<div class="top"><div><div class="logo">🎵 ${esc(g.title)}</div><div>Код комнаты: <b class="code" style="font-size:20px">${g.code}</b></div></div><div class="actions"><button id="edit">⚙ Подготовка</button><button id="reset">Сброс</button></div></div><div class="host-grid"><div><div class="card center"><div class="muted">ТЕКУЩАЯ МЕЛОДИЯ</div><h1>${q?esc(q.title):'Выберите ноту'}</h1>${q?`<div class="muted">${esc(q.category)} · ${q.value} очков</div>`:''}<div id="status" class="status">${locked?'🥇 '+esc(lockedName)+' отвечает':q?'🎵 Готовы — нажмите Играть':'Выберите ноту'}</div><div class="actions center"><button class="primary" id="play" ${q?'':'disabled'}>▶ Играть</button><button id="stop" ${q?'':'disabled'}>⏹ Стоп</button><button class="good" id="correct" ${locked?'':'disabled'}>✅ Правильно +${q?.value||0}</button><button class="bad" id="wrong" ${locked?'':'disabled'}>❌ Неправильно</button><button id="answerBtn" ${q?'':'disabled'}>👀 Показать ответ</button><button id="clear" ${locked?'':'disabled'}>↩ Открыть другим</button></div><div id="answer" class="answer"></div></div><div class="board">${g.questions.map(x=>`<button class="note ${x.used?'used':''}" data-id="${x.id}" ${x.used?'disabled':''}><div class="cat">${esc(x.category)}</div>${x.value}</button>`).join('')}</div><div class="scores">${g.teams.map(t=>`<div class="team"><b>${esc(t.name)}</b><div class="pts">${t.score}</div></div>`).join('')}</div></div><div class="card center"><h3>📱 Подключение команд</h3><div id="qrcode" class="qr"></div><p class="small muted">Сканируйте QR-код телефоном</p><div class="linkbox">${esc(playerUrl(g.code))}</div><p>Код: <b>${g.code}</b></p><button id="copy">Скопировать ссылку</button><hr style="border-color:#30343f"><div class="help" style="text-align:left"><b>Подготовка:</b> игры редактируются кнопкой «⚙ Подготовка». Песни загружаются заранее.</div></div></div>`);new QRCode(document.querySelector('#qrcode'),{text:playerUrl(g.code),width:170,height:170});document.querySelectorAll('.note').forEach(b=>b.onclick=()=>selectQuestion(+b.dataset.id));document.querySelector('#play').onclick=play;document.querySelector('#stop').onclick=stop;document.querySelector('#correct').onclick=correctAnswer;document.querySelector('#wrong').onclick=wrongAnswer;document.querySelector('#answerBtn').onclick=showAnswer;document.querySelector('#clear').onclick=clearLock;document.querySelector('#reset').onclick=resetGame;document.querySelector('#edit').onclick=()=>location.search='?edit='+g.code;document.querySelector('#copy').onclick=async()=>{await navigator.clipboard.writeText(playerUrl(g.code));document.querySelector('#copy').textContent='Скопировано ✓'}}
function play(){const q=state.game.questions.find(x=>x.id===state.game.current_question_id);if(!q)return;if(!q.audio_url){document.querySelector('#status').textContent='⚠ Для этой мелодии ещё нет MP3.';return}stop();state.audio=new Audio(q.audio_url);state.audio.play().catch(()=>document.querySelector('#status').textContent='Нажмите «Играть» ещё раз.');}
function stop(){if(state.audio){state.audio.pause();state.audio.currentTime=0;state.audio=null}}
function showAnswer(){const q=state.game.questions.find(x=>x.id===state.game.current_question_id);document.querySelector('#answer').textContent=q?.answer?'Ответ: '+q.answer:'Ответ пока не заполнен.'}
async function clearLock(){await sb.from('games').update({locked_team_id:null}).eq('id',state.game.id)}
async function correctAnswer(){const g=state.game,q=g.questions.find(x=>x.id===g.current_question_id),tid=g.locked_team_id;if(!q||!tid)return;stop();const teams=g.teams.map(t=>t.id===tid?{...t,score:t.score+q.value}:t);await sb.from('games').update({teams,locked_team_id:null,blocked_team_ids:[]}).eq('id',g.id)}
async function wrongAnswer(){const g=state.game,tid=g.locked_team_id;if(!tid)return;stop();const blocked=Array.from(new Set([...(g.blocked_team_ids||[]),tid]));await sb.from('games').update({locked_team_id:null,blocked_team_ids:blocked}).eq('id',g.id)}
async function resetGame(){if(!confirm('Сбросить очки и открыть все ноты?'))return;stop();const qs=state.game.questions.map(q=>({...q,used:false})),teams=state.game.teams.map(t=>({...t,score:0}));await sb.from('games').update({questions:qs,teams,current_question_id:null,locked_team_id:null,blocked_team_ids:[]}).eq('id',state.game.id)}
function playerJoin(g){shell(`<div class="card join center"><div class="logo">🎵 Угадай мелодию</div><p class="muted">Комната <b>${esc(g.code)}</b></p><h2>Выберите свою команду</h2><select id="team"><option value="">— Команда —</option>${g.teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select><button class="primary" id="join">Подключиться</button><p id="err" class="muted"></p></div>`);document.querySelector('#join').onclick=()=>{const id=+document.querySelector('#team').value;if(!id){document.querySelector('#err').textContent='Выберите команду.';return}state.team=id;localStorage.setItem('ugaday-team-'+g.code,String(id));playerView(state.game)}}
function playerView(g){const t=g.teams.find(x=>x.id===state.team);const locked=g.locked_team_id,blocked=g.blocked_team_ids||[],myBlocked=blocked.includes(state.team),disabled=!!locked||myBlocked;let text='Слушайте мелодию';if(locked===state.team)text='🥇 ВЫ ПЕРВЫЕ! Ждите вопроса ведущего.';else if(locked)text=`⏳ ${g.teams.find(x=>x.id===locked)?.name||'Другая команда'} отвечает`;else if(myBlocked)text='❌ Вы уже ошиблись. Ждите следующую мелодию.';shell(`<div class="card join center"><div class="muted">КОМАНДА</div><h1>${esc(t?.name||'Команда')}</h1><div class="status">${esc(text)}</div><button id="buzz" class="big" ${disabled?'disabled':''}>🔴 ЖМАК!</button><p class="muted">${disabled?'Кнопка пока недоступна.':'Нажмите как можно быстрее, когда узнаете мелодию.'}</p><div class="small muted">Очки: ${t?.score||0}</div></div>`);document.querySelector('#buzz').onclick=buzz}
async function buzz(){const btn=document.querySelector('#buzz');btn.disabled=true;const g=state.game;if(!g.current_question_id){document.querySelector('.status').textContent='⏳ Ведущий ещё не выбрал мелодию.';btn.disabled=false;return}const {data,error}=await sb.rpc('claim_buzz',{p_game_id:g.id,p_question_id:g.current_question_id,p_team_id:state.team});if(error){btn.disabled=false;document.querySelector('.status').textContent='Ошибка: '+error.message;return}document.querySelector('.status').textContent=data?.won?'🥇 ВЫ ПЕРВЫЕ! Ждите вопроса ведущего.':'⏳ Кто-то успел раньше.'}
async function boot(){try{if(params.has('edit')){await loadGame(params.get('edit'));editorView(state.game)}else if(params.has('host')){await loadGame(params.get('host'));subscribe();hostView(state.game)}else if(params.has('player')){await loadGame(params.get('player'));state.team=+(localStorage.getItem('ugaday-team-'+params.get('player'))||0);subscribe();state.team?playerView(state.game):playerJoin(state.game)}else hostSetup()}catch(e){shell(`<div class="card join"><h2>Ошибка</h2><p>${esc(e.message)}</p></div>`)}}
boot();
</script></body></html>
